version: "3.9"

services:
  bank-db:
    image: postgres:15
    container_name: bank-db
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - bank-pgdata:/var/lib/postgresql/data
    networks:
      - bank-network

  bank-backend:
    build:
      context: ./bank_server
      dockerfile: dockerfile
    container_name: bank-backend
    depends_on:
      - bank-db
    ports:
      - "8080:8080"
    environment:
      ENV: DOCKER
      DB_USER: admin
      DB_PASSWORD: admin
    networks:
      - bank-network

volumes:
  bank-pgdata:

networks:
  bank-network:
